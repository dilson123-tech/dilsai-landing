services:
  - type: web
    name: dilsai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: DilsAI Estudos API
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: CORS_ALLOW_ORIGINS
        value: https://dilson123-tech.github.io
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_MAX_TOKENS
        value: "900"
      - key: OPENAI_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_CHAT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_MATERIAL_PER_MINUTE
        value: "8"
