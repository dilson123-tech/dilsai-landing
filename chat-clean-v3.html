<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DilsAI Estudos — Chat Seco V3</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2ff;
      color: #0f172a;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 22px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
    }

    .subtitle {
      margin: 0 0 16px;
      color: #64748b;
      font-size: 0.9rem;
    }

    .chat {
      height: calc(100vh - 92px);
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 24px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid #dbe3ef;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header strong {
      display: block;
    }

    .chat-header span {
      display: block;
      color: #64748b;
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .chat-header button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 800;
      cursor: pointer;
    }

    .messages {
      padding: 18px;
      overflow-y: auto;
      background: #fbfdff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 0.94rem;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #dbe3ef;
    }

    .msg.user {
      align-self: flex-end;
      background: #5b21e6;
      color: #ffffff;
    }

    .msg small {
      display: block;
      margin-bottom: 6px;
      opacity: 0.75;
      font-weight: 800;
      font-size: 0.72rem;
    }

    .msg img {
      display: block;
      max-width: min(360px, 100%);
      max-height: 280px;
      object-fit: contain;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid rgba(255,255,255,0.35);
      margin-bottom: 8px;
    }

    .composer-wrap {
      padding: 14px;
      border-top: 1px solid #dbe3ef;
      background: #ffffff;
    }

    .composer {
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 10px;
      background: #ffffff;
      display: grid;
      gap: 8px;
    }

    .composer:focus-within {
      border-color: #5b21e6;
      box-shadow: 0 0 0 4px rgba(91, 33, 230, 0.12);
    }

    .pending {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attachment {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 14px;
      border: 1px solid #dbe3ef;
      overflow: hidden;
      background: #f8fafc;
    }

    .attachment img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .attachment button {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      color: white;
      cursor: pointer;
      font-weight: 900;
      line-height: 24px;
    }

    .attachment-status {
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 5px;
      padding: 4px 5px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.78);
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 800;
      text-align: center;
    }

    .attachment-status.ok {
      background: rgba(22, 163, 74, 0.9);
    }

    .attachment-status.error {
      background: rgba(220, 38, 38, 0.9);
    }


    .input-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .attach-btn,
    .send-btn {
      border: 0;
      cursor: pointer;
      font-weight: 900;
    }

    .attach-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 1.15rem;
    }

    .send-btn {
      min-width: 84px;
      height: 42px;
      border-radius: 14px;
      background: #5b21e6;
      color: #ffffff;
    }

    .text-input {
      min-height: 42px;
      max-height: 150px;
      overflow-y: auto;
      outline: none;
      padding: 11px 4px;
      line-height: 1.35;
      font-size: 0.95rem;
    }

    .text-input:empty::before {
      content: attr(data-placeholder);
      color: #94a3b8;
    }

    .hint {
      color: #64748b;
      font-size: 0.74rem;
      padding-left: 4px;
    }

    .composer.drag {
      border-color: #2563eb;
      background: #eef6ff;
    }

    @media (max-width: 720px) {
      .page { padding: 10px; }
      .chat { height: calc(100vh - 74px); border-radius: 18px; }
      .msg { max-width: 94%; }
      .input-row { grid-template-columns: auto 1fr; }
      .send-btn { grid-column: 1 / -1; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>DilsAI Estudos — Chat Seco V3</h1>
    <p class="subtitle">Teste isolado: texto + Ctrl+V de print no mesmo campo, sem lateral e sem OCR ainda.</p>

    <section class="chat">
      <header class="chat-header">
        <div>
          <strong>Professor DilsAI</strong>
          <span>Cole print com Ctrl+V, arraste ou escolha imagem. Depois envie.</span>
        </div>
        <button id="clear" type="button">Limpar</button>
      </header>

      <div id="messages" class="messages"></div>

      <form id="form" class="composer-wrap">
        <div id="composer" class="composer">
          <div id="pending" class="pending"></div>

          <div class="input-row">
            <button id="attach" class="attach-btn" type="button" title="Escolher imagem">+</button>
            <div id="input" class="text-input" contenteditable="true" data-placeholder="Digite aqui ou cole um print com Ctrl+V..."></div>
            <button class="send-btn" type="submit">Enviar</button>
          </div>

          <div class="hint">O print fica anexado aqui no campo. Nada é enviado antes de clicar em Enviar.</div>
        </div>

        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      </form>
    </section>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");
    const pending = document.getElementById("pending");
    const fileInput = document.getElementById("file");
    const attach = document.getElementById("attach");

    const API_BASE = localStorage.getItem("DILSAI_API_BASE") || "http://127.0.0.1:8091";
    const OCR_URL = `${API_BASE}/api/v1/materials/extract-text`;

    let pendingImages = [];

    function addMessage(role, text, meta = "") {
      const node = document.createElement("div");
      node.className = `msg ${role}`;

      if (meta) {
        const small = document.createElement("small");
        small.textContent = meta;
        node.appendChild(small);
      }

      const body = document.createElement("div");
      body.textContent = text;
      node.appendChild(body);

      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
    }

    function addImageMessage(file, caption = "") {
      const node = document.createElement("div");
      node.className = "msg user";

      const small = document.createElement("small");
      small.textContent = "Imagem enviada";
      node.appendChild(small);

      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.alt = caption || "Print enviado";
      node.appendChild(img);

      if (caption) {
        const label = document.createElement("div");
        label.textContent = caption;
        node.appendChild(label);
      }

      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
    }

    function renderPending() {
      pending.innerHTML = "";

      pendingImages.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "attachment";

        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.file.name || "print anexado";
        card.appendChild(img);

        const status = document.createElement("div");
        status.className = `attachment-status ${item.ocrStatus === "ok" ? "ok" : item.ocrStatus === "error" ? "error" : ""}`;
        status.textContent = item.ocrStatus === "ok"
          ? "OCR pronto"
          : item.ocrStatus === "error"
            ? "OCR falhou"
            : "Lendo...";
        card.appendChild(status);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          URL.revokeObjectURL(item.url);
          pendingImages.splice(index, 1);
          renderPending();
          input.focus();
        });
        card.appendChild(remove);

        pending.appendChild(card);
      });
    }

    function loadImageForOcr(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Não consegui carregar a imagem para OCR."));
        };

        image.src = url;
      });
    }

    function canvasToOcrBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("Não consegui preparar a imagem para OCR."));
        }, type, quality);
      });
    }

    async function prepareImageForOcr(file) {
      const maxBytes = 1500 * 1024;

      if (file.size <= maxBytes) return file;

      const image = await loadImageForOcr(file);
      let bestBlob = file;

      const widths = [2200, 1800, 1500, 1200, 1000];
      const qualities = [0.92, 0.86, 0.78, 0.70];

      for (const maxWidth of widths) {
        const scale = Math.min(1, maxWidth / image.width);
        const width = Math.max(1, Math.round(image.width * scale));
        const height = Math.max(1, Math.round(image.height * scale));

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(image, 0, 0, width, height);

        for (const quality of qualities) {
          const blob = await canvasToOcrBlob(canvas, "image/jpeg", quality);

          if (blob.size < bestBlob.size) bestBlob = blob;

          if (blob.size <= maxBytes) {
            return new File([blob], `ocr-print-dilsai-${Date.now()}.jpg`, {
              type: "image/jpeg",
              lastModified: Date.now(),
            });
          }
        }
      }

      return new File([bestBlob], `ocr-print-dilsai-${Date.now()}.jpg`, {
        type: "image/jpeg",
        lastModified: Date.now(),
      });
    }

    function cleanOcrText(rawText) {
      return String(rawText || "")
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .filter((line) => !/^dilsai estudos/i.test(line))
        .filter((line) => !/^chat seco/i.test(line))
        .filter((line) => !/^professor dilsai/i.test(line))
        .filter((line) => !/^cole print/i.test(line))
        .filter((line) => !/^cole um print/i.test(line))
        .filter((line) => !/^digite aqui/i.test(line))
        .filter((line) => !/^enviar$/i.test(line))
        .filter((line) => !/^limpar$/i.test(line))
        .join("\n")
        .trim();
    }

    async function extractOcrText(file) {
      const ocrFile = await prepareImageForOcr(file);

      const response = await fetch(OCR_URL, {
        method: "POST",
        headers: {
          "Content-Type": ocrFile.type || "application/octet-stream",
          "X-File-Name": encodeURIComponent(ocrFile.name || file.name || "print"),
        },
        body: ocrFile,
      });

      let data = null;
      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        throw new Error(data?.detail || `HTTP ${response.status}`);
      }

      return cleanOcrText(data?.text || "");
    }

    async function runOcrForPendingImage(item) {
      try {
        item.ocrText = await extractOcrText(item.file);
        item.ocrStatus = item.ocrText ? "ok" : "error";
        item.ocrError = item.ocrText ? "" : "OCR não encontrou texto útil.";
      } catch (error) {
        item.ocrText = "";
        item.ocrStatus = "error";
        item.ocrError = error.message;
      }

      renderPending();
    }


    function addPendingImage(file) {
      if (!file || !String(file.type || "").startsWith("image/")) return;

      const item = {
        file,
        url: URL.createObjectURL(file),
        ocrStatus: "pending",
        ocrText: "",
        ocrError: "",
      };

      pendingImages.push(item);

      renderPending();
      input.focus();

      runOcrForPendingImage(item);
    }

    function getClipboardImage(event) {
      const items = Array.from(event.clipboardData?.items || []);

      for (const item of items) {
        if (item.kind === "file" && String(item.type || "").startsWith("image/")) {
          const file = item.getAsFile();
          if (file) return file;
        }
      }

      const files = Array.from(event.clipboardData?.files || []);
      return files.find((file) => String(file.type || "").startsWith("image/")) || null;
    }

    function getDroppedImage(event) {
      const files = Array.from(event.dataTransfer?.files || []);
      return files.find((file) => String(file.type || "").startsWith("image/")) || null;
    }

    input.addEventListener("paste", (event) => {
      const file = getClipboardImage(event);
      if (!file) return;

      event.preventDefault();
      event.stopPropagation();
      addPendingImage(file);
    });

    composer.addEventListener("paste", (event) => {
      const file = getClipboardImage(event);
      if (!file) return;

      event.preventDefault();
      event.stopPropagation();
      addPendingImage(file);
    });

    composer.addEventListener("dragover", (event) => {
      if (!Array.from(event.dataTransfer?.types || []).includes("Files")) return;
      event.preventDefault();
      composer.classList.add("drag");
    });

    composer.addEventListener("dragenter", (event) => {
      if (!Array.from(event.dataTransfer?.types || []).includes("Files")) return;
      event.preventDefault();
      composer.classList.add("drag");
    });

    composer.addEventListener("dragleave", () => {
      composer.classList.remove("drag");
    });

    composer.addEventListener("drop", (event) => {
      const file = getDroppedImage(event);
      if (!file) return;

      event.preventDefault();
      event.stopPropagation();
      composer.classList.remove("drag");
      addPendingImage(file);
    });

    attach.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (event) => {
      const files = Array.from(event.target.files || []);
      files.forEach(addPendingImage);
      event.target.value = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = input.innerText.trim();
      const hasImages = pendingImages.length > 0;

      if (!text && !hasImages) return;

      pendingImages.forEach((item) => {
        addImageMessage(item.file, item.file.name || "print");
      });

      if (text) {
        addMessage("user", text, "Pergunta");
      }

      const ocrContext = pendingImages
        .map((item) => item.ocrText)
        .filter(Boolean)
        .join("\n\n");

      if (ocrContext) {
        console.log("[DilsAI Chat Seco V3] OCR pronto para futura API:", ocrContext);
      }

      pendingImages.forEach((item) => URL.revokeObjectURL(item.url));
      pendingImages = [];
      renderPending();
      input.innerHTML = "";
      input.focus();
    });

    document.getElementById("clear").addEventListener("click", () => {
      messages.innerHTML = "";
      pendingImages.forEach((item) => URL.revokeObjectURL(item.url));
      pendingImages = [];
      renderPending();
      input.innerHTML = "";
      addMessage(
        "assistant",
        "Chat seco pronto. Cole um print com Ctrl+V no campo de digitar, arraste imagem ou use o botão +.",
        "Bem-vindo"
      );
      input.focus();
    });

    addMessage(
      "assistant",
      "Chat seco pronto. Cole um print com Ctrl+V no campo de digitar, arraste imagem ou use o botão +.",
      "Bem-vindo"
    );

    input.focus();
  </script>
</body>
</html>
